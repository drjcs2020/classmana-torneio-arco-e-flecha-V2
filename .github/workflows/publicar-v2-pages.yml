name: Publicar ClassMana V2 no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v2
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos da V2
        uses: actions/checkout@v4
      - name: Validar os nove modelos do arsenal 3D
        run: node scripts/qa-arsenal.mjs
      - name: Preparar site estatico da V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='/.git/' --exclude='/.github/' \
            --exclude='/_site/' --exclude='*.zip' \
            --exclude='*.cmd' --exclude='*.ps1' \
            --exclude='/duel-api/' --exclude='/backend/' \
            --exclude='/docs/' --exclude='/scripts/' \
            --exclude='/rebuild/' \
            --exclude='*.sqlite' --exclude='*.sqlite-shm' --exclude='*.sqlite-wal' \
            ./ _site/
          test -s _site/index.html
          test -s _site/arena.html
          test -s _site/game-v3.js
          test -s _site/online-config.js
          test -d _site/assets/v2
          touch _site/.nojekyll
          echo 'ClassMana V2: site preparado'
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
